<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heirvo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Load splash. Inlined here (not in React) so it paints on the very first
         frame, before any JS runs — no white flash on cold start. main.tsx fades
         it out once the app is ready. -->
    <style>
      html { background: #000; }
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #000; display: flex; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
      }
      #splash img {
        width: min(620px, 82vw); height: auto;
        filter: drop-shadow(0 10px 44px rgba(40, 120, 255, 0.18));
        animation: heirvo-splash-in 0.5s ease both;
      }
      #splash.heirvo-splash-hide { opacity: 0; }
      @keyframes heirvo-splash-in {
        from { opacity: 0; transform: scale(0.985); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body class="bg-ink-50 text-ink-900">
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="/brand/load-splash.png" alt="Heirvo" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
