<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Never let WebView2 serve a stale cached frontend. Vite already hashes
         JS/CSS filenames; this stops the entry document itself from being cached,
         which is what caused old UI to show after a rebuild. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Heirvo</title>
    <!-- Fonts are self-hosted (Fontsource), imported in src/main.tsx — no
         network call to Google Fonts. See that file for the rationale. -->
    <!-- Load splash. Inlined here (not in React) so it paints on the very first
         frame, before any JS runs — no white flash on cold start. main.tsx fades
         it out once the app is ready. -->
    <style>
      html { background: #000; }
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #000; display: flex; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
      }
      #splash img {
        width: min(620px, 82vw); height: auto;
        filter: drop-shadow(0 10px 44px rgba(40, 120, 255, 0.18));
        animation: heirvo-splash-in 0.5s ease both;
      }
      #splash.heirvo-splash-hide { opacity: 0; }
      @keyframes heirvo-splash-in {
        from { opacity: 0; transform: scale(0.985); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body class="bg-ink-50 text-ink-900">
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="/brand/load-splash.png" alt="Heirvo" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
