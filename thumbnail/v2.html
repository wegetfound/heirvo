<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Heirvo Thumbnail v2 — Emotional Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@900&family=Cormorant+Garamond:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #0a0e1a;
    font-family: 'Sora', sans-serif;
  }

  /* ─── ROOT CONTAINER ─── */
  .frame {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }

  /* ══════════════════════════════════════
     LEFT HALF — WARM NOSTALGIC MEMORY
  ══════════════════════════════════════ */
  .left {
    position: absolute;
    inset: 0;
    width: 680px;                  /* slightly past centre so diagonal cut lands at ~50% */
    clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%);
    background: linear-gradient(
      135deg,
      #f5dfa0 0%,
      #e8b86d 25%,
      #c97c3a 55%,
      #7a3d10 85%,
      #3d1c05 100%
    );
    overflow: hidden;
  }

  /* Film-burn glow top-left */
  .left::before {
    content: '';
    position: absolute;
    top: -80px; left: -80px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,210,100,0.55) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Heavy vignette */
  .left::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 90% 90% at 40% 50%,
      transparent 30%,
      rgba(80,30,0,0.55) 70%,
      rgba(20,6,0,0.85) 100%
    );
    pointer-events: none;
  }

  /* Film-grain noise layer — SVG feTurbulence */
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.18;
    pointer-events: none;
  }

  /* Old filmstrip sprocket holes top */
  .sprockets {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 20px;
    z-index: 3;
  }
  .sprocket-hole {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 2px solid rgba(255,220,130,0.6);
    flex-shrink: 0;
  }

  /* Same at bottom */
  .sprockets-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 20px;
    z-index: 3;
  }

  /* Home video "scene" elements — CSS art */
  .memory-scene {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-52%, -48%);
    width: 340px;
    height: 240px;
    z-index: 2;
  }

  /* Family silhouette group */
  .silhouette-group {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .figure {
    background: rgba(80,30,0,0.7);
    border-radius: 50% 50% 0 0;
    box-shadow: 0 0 20px rgba(255,180,60,0.3);
  }
  .figure-adult {
    width: 38px; height: 90px;
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
  }
  .figure-child {
    width: 28px; height: 62px;
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
  }
  .figure-toddler {
    width: 22px; height: 42px;
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
  }

  /* Warm "sunset/backyard" gradient horizon */
  .horizon {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(0deg, rgba(120,50,0,0.7) 0%, transparent 100%);
  }

  /* DVD disc (old, faded) */
  .disc-old {
    position: absolute;
    top: 30px;
    left: 60px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      rgba(255,200,100,0.45) 0deg,
      rgba(200,140,60,0.35) 60deg,
      rgba(255,220,140,0.45) 120deg,
      rgba(180,110,40,0.35) 180deg,
      rgba(255,200,100,0.4) 240deg,
      rgba(220,160,70,0.35) 300deg,
      rgba(255,200,100,0.45) 360deg
    );
    border: 2px solid rgba(255,200,100,0.3);
    box-shadow:
      0 0 30px rgba(200,130,30,0.5),
      inset 0 0 30px rgba(150,80,10,0.4);
    z-index: 3;
    overflow: hidden;
  }
  .disc-old::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(60,30,5,0.85);
    border: 1px solid rgba(255,200,100,0.4);
  }
  /* Scratches overlay on old disc */
  .disc-old::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      72deg,
      transparent 0px,
      transparent 8px,
      rgba(255,255,255,0.06) 8px,
      rgba(255,255,255,0.06) 9px
    );
    border-radius: 50%;
  }

  /* Hand-written label on disc */
  .disc-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 9px;
    color: rgba(255,220,130,0.9);
    line-height: 1.3;
    z-index: 4;
  }

  /* Timestamp burn-in */
  .timestamp {
    position: absolute;
    bottom: 38px;
    right: 40px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: rgba(255,200,80,0.7);
    letter-spacing: 2px;
    z-index: 5;
    text-shadow: 0 0 8px rgba(255,180,40,0.8);
  }

  /* "REC" indicator */
  .rec-dot {
    position: absolute;
    top: 38px;
    right: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 5;
  }
  .rec-circle {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(220,60,60,0.8);
    box-shadow: 0 0 8px rgba(220,60,60,0.8);
  }
  .rec-text {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: rgba(220,60,60,0.9);
    letter-spacing: 2px;
  }

  /* LEFT headline word */
  .word-left {
    position: absolute;
    bottom: 110px;
    left: 48px;
    z-index: 10;
    font-family: 'Sora', sans-serif;
    font-weight: 900;
    font-size: 108px;
    line-height: 0.88;
    letter-spacing: -3px;
    color: rgba(255,235,160,0.92);
    text-shadow:
      0 0 60px rgba(255,180,50,0.7),
      0 4px 20px rgba(100,40,0,0.9),
      2px 2px 0px rgba(100,40,0,0.6);
    mix-blend-mode: normal;
  }

  /* ══════════════════════════════════════
     RIGHT HALF — MODERN, RECOVERED
  ══════════════════════════════════════ */
  .right {
    position: absolute;
    inset: 0;
    left: 580px;                   /* overlap zone for diagonal */
    clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
    background: linear-gradient(
      135deg,
      #0d1628 0%,
      #0a1220 40%,
      #060d1a 100%
    );
    overflow: hidden;
  }

  /* Blue glow top-right corner — light source */
  .right::before {
    content: '';
    position: absolute;
    top: -120px; right: -60px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(60,130,255,0.28) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Subtle grid pattern — tech feel */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(60,130,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(60,130,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Recovered disc — sharp, glowing blue */
  .disc-new {
    position: absolute;
    top: 60px;
    right: 80px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #1a3a6e 0deg,
      #3a7aff 30deg,
      #6eb0ff 60deg,
      #1a4a9e 90deg,
      #2d6ed4 120deg,
      #5a9dff 150deg,
      #0e2a5c 180deg,
      #4a8aff 210deg,
      #7ac0ff 240deg,
      #1a3a6e 270deg,
      #3a7aff 300deg,
      #6eb0ff 330deg,
      #1a3a6e 360deg
    );
    box-shadow:
      0 0 50px rgba(80,160,255,0.7),
      0 0 100px rgba(60,120,255,0.35),
      inset 0 0 40px rgba(0,30,80,0.6);
    border: 1px solid rgba(120,180,255,0.4);
    z-index: 4;
  }
  .disc-new::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #070f1e;
    border: 2px solid rgba(80,160,255,0.5);
    box-shadow: 0 0 12px rgba(80,160,255,0.5);
  }
  /* Shine sweep on new disc */
  .disc-new::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,0.25) 0%,
      transparent 40%,
      transparent 60%,
      rgba(80,160,255,0.15) 100%
    );
  }

  /* Progress / scan lines — active recovery feel */
  .scan-lines {
    position: absolute;
    top: 230px;
    right: 50px;
    width: 220px;
    z-index: 4;
  }
  .scan-bar {
    height: 3px;
    border-radius: 2px;
    margin-bottom: 6px;
    background: rgba(80,160,255,0.15);
    overflow: hidden;
    position: relative;
  }
  .scan-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #3a7aff, #7ac0ff);
    box-shadow: 0 0 8px rgba(100,170,255,0.8);
  }
  .scan-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: rgba(100,170,255,0.55);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  /* File icons — recovered */
  .file-cluster {
    position: absolute;
    bottom: 80px;
    right: 55px;
    display: flex;
    gap: 10px;
    z-index: 4;
    align-items: flex-end;
  }
  .file-chip {
    background: rgba(30,60,120,0.6);
    border: 1px solid rgba(80,160,255,0.3);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    box-shadow: 0 0 16px rgba(60,130,255,0.2);
  }
  .file-chip-icon {
    width: 22px; height: 28px;
    background: rgba(60,130,255,0.3);
    border-radius: 3px 8px 3px 3px;
    position: relative;
    border: 1px solid rgba(80,160,255,0.5);
  }
  .file-chip-icon::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 8px; height: 8px;
    background: rgba(80,160,255,0.4);
    clip-path: polygon(0 0, 100% 100%, 0 100%);
  }
  .file-chip-label {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: rgba(120,190,255,0.7);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* RIGHT headline word */
  .word-right {
    position: absolute;
    bottom: 110px;
    right: 20px;
    z-index: 10;
    font-family: 'Sora', sans-serif;
    font-weight: 900;
    font-size: 108px;
    line-height: 0.88;
    letter-spacing: -3px;
    color: #ffffff;
    text-shadow:
      0 0 60px rgba(80,160,255,0.9),
      0 0 120px rgba(60,120,255,0.5),
      0 4px 20px rgba(0,20,60,0.8);
  }

  /* ══════════════════════════════════════
     DIAGONAL SPLIT DIVIDER
  ══════════════════════════════════════ */
  .split-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 618px;
    width: 0;
    z-index: 20;
    /* The diagonal crack/slash */
    transform: rotate(0deg);
  }

  /* SVG diagonal crack */
  .crack-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    z-index: 20;
    pointer-events: none;
  }

  /* Heirvo brand mark */
  .brand-mark {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(5,10,20,0.65);
    border: 1px solid rgba(100,160,255,0.2);
    border-radius: 40px;
    padding: 8px 18px 8px 12px;
    backdrop-filter: blur(8px);
  }
  .brand-mark img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(80,160,255,0.6));
  }
  .brand-name {
    font-family: 'Sora', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(80,160,255,0.5);
  }

  /* ══════════════════════════════════════
     SUBTITLE — Cormorant Garamond italic
  ══════════════════════════════════════ */
  .subtitle-left {
    position: absolute;
    bottom: 72px;
    left: 48px;
    z-index: 10;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 26px;
    color: rgba(255,210,120,0.8);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(100,40,0,0.8);
  }
  .subtitle-right {
    position: absolute;
    bottom: 72px;
    right: 24px;
    z-index: 10;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 26px;
    color: rgba(120,190,255,0.8);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,40,100,0.8);
  }

  /* ══════════════════════════════════════
     EXTRA POLISH OVERLAYS
  ══════════════════════════════════════ */

  /* Top edge chromatic-aberration glow on split */
  .split-glow {
    position: absolute;
    top: 0; bottom: 0;
    left: 588px;
    width: 84px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,160,60,0.08) 25%,
      rgba(255,255,255,0.12) 50%,
      rgba(80,160,255,0.08) 75%,
      transparent 100%
    );
    z-index: 19;
    pointer-events: none;
  }

  /* Bottom strip — call to action feel */
  .bottom-strip {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(
      90deg,
      #c97c3a 0%,
      #f5dfa0 20%,
      rgba(255,255,255,0.9) 50%,
      #3a7aff 80%,
      #7ac0ff 100%
    );
    z-index: 30;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="frame">

  <!-- ░░ LEFT — WARM NOSTALGIC HALF ░░ -->
  <div class="left">
    <!-- Film grain SVG filter -->
    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
        <feBlend in="SourceGraphic" mode="multiply"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-filter)" opacity="0.4"/>
    </svg>

    <!-- Filmstrip sprocket holes — top -->
    <div class="sprockets">
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
    </div>

    <!-- Filmstrip sprocket holes — bottom -->
    <div class="sprockets-bottom">
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
      <div class="sprocket-hole"></div>
    </div>

    <!-- REC indicator -->
    <div class="rec-dot">
      <div class="rec-circle"></div>
      <span class="rec-text">REC</span>
    </div>

    <!-- Faded scratched DVD -->
    <div class="disc-old">
      <div class="disc-label">Family<br>Xmas<br>'03</div>
    </div>

    <!-- Memory scene — family silhouettes -->
    <div class="memory-scene">
      <!-- Warm sky / yard gradient -->
      <svg width="340" height="240" viewBox="0 0 340 240" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0">
        <!-- Sky -->
        <defs>
          <radialGradient id="sun" cx="30%" cy="35%" r="40%">
            <stop offset="0%" stop-color="#ffcc60" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
          <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8b4a10" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#3d1c05" stop-opacity="0.8"/>
          </linearGradient>
        </defs>
        <rect width="340" height="240" fill="url(#sun)"/>
        <rect y="160" width="340" height="80" fill="url(#grass)"/>

        <!-- Tree silhouettes -->
        <ellipse cx="280" cy="140" rx="45" ry="80" fill="rgba(60,25,5,0.45)"/>
        <rect x="272" y="190" width="16" height="50" fill="rgba(60,25,5,0.5)"/>
        <ellipse cx="30" cy="155" rx="30" ry="55" fill="rgba(60,25,5,0.4)"/>
        <rect x="23" y="195" width="12" height="45" fill="rgba(60,25,5,0.45)"/>

        <!-- Family silhouettes -->
        <!-- Adult 1 -->
        <ellipse cx="148" cy="148" rx="14" ry="18" fill="rgba(50,20,3,0.75)"/>
        <rect x="138" y="160" width="20" height="55" rx="4" fill="rgba(50,20,3,0.75)"/>
        <!-- Adult 2 -->
        <ellipse cx="185" cy="148" rx="13" ry="17" fill="rgba(50,20,3,0.7)"/>
        <rect x="176" y="160" width="18" height="55" rx="4" fill="rgba(50,20,3,0.7)"/>
        <!-- Child -->
        <ellipse cx="165" cy="172" rx="10" ry="13" fill="rgba(50,20,3,0.7)"/>
        <rect x="157" y="182" width="16" height="38" rx="3" fill="rgba(50,20,3,0.7)"/>

        <!-- Lens flare streaks -->
        <line x1="50" y1="30" x2="320" y2="60" stroke="rgba(255,220,100,0.08)" stroke-width="3"/>
        <line x1="0" y1="50" x2="340" y2="80" stroke="rgba(255,200,80,0.05)" stroke-width="2"/>
      </svg>
    </div>

    <!-- Timestamp -->
    <div class="timestamp">12:34:07</div>

    <!-- LEFT word -->
    <div class="word-left">LOST</div>
    <div class="subtitle-left">for years</div>
  </div>

  <!-- ░░ RIGHT — MODERN RECOVERED HALF ░░ -->
  <div class="right">
    <div class="grid-bg"></div>

    <!-- Glowing recovered disc -->
    <div class="disc-new"></div>

    <!-- Scan progress bars -->
    <div class="scan-lines">
      <div class="scan-label">Recovering files</div>
      <div class="scan-bar"><div class="scan-fill" style="width:94%"></div></div>
      <div class="scan-bar"><div class="scan-fill" style="width:78%"></div></div>
      <div class="scan-bar"><div class="scan-fill" style="width:100%"></div></div>
      <div class="scan-label" style="margin-top:6px; color:rgba(80,200,140,0.65)">✓ 1,847 files rescued</div>
    </div>

    <!-- Recovered file chips -->
    <div class="file-cluster">
      <div class="file-chip">
        <div class="file-chip-icon"></div>
        <span class="file-chip-label">Wedding</span>
      </div>
      <div class="file-chip">
        <div class="file-chip-icon"></div>
        <span class="file-chip-label">Birthday</span>
      </div>
      <div class="file-chip" style="margin-bottom:12px">
        <div class="file-chip-icon"></div>
        <span class="file-chip-label">Xmas '03</span>
      </div>
    </div>

    <!-- RIGHT word -->
    <div class="word-right">SAVED</div>
    <div class="subtitle-right">forever</div>
  </div>

  <!-- ░░ DIAGONAL SPLIT GLOW ░░ -->
  <div class="split-glow"></div>

  <!-- ░░ CRACK / SLASH SVG ░░ -->
  <svg class="crack-svg" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Hot-white crack glow -->
      <filter id="crack-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
      <filter id="crack-outer" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="12"/>
      </filter>
    </defs>

    <!-- Outer glow — warm amber bleeds left -->
    <path d="M 590 0 L 618 0 L 668 720 L 638 720 Z" fill="rgba(255,160,60,0.12)" filter="url(#crack-outer)"/>
    <!-- Outer glow — cool blue bleeds right -->
    <path d="M 618 0 L 650 0 L 700 720 L 665 720 Z" fill="rgba(80,160,255,0.12)" filter="url(#crack-outer)"/>

    <!-- Main slash body — dark gap -->
    <path d="M 610 0 L 628 0 L 674 720 L 655 720 Z" fill="rgba(4,8,18,0.9)"/>

    <!-- Secondary micro-crack left of main -->
    <path d="M 595 0 L 600 0 L 640 420 L 638 420" stroke="rgba(255,180,80,0.3)" stroke-width="1.5" fill="none"/>

    <!-- Main crack edge — warm amber left side -->
    <line x1="610" y1="0" x2="655" y2="720"
          stroke="rgba(255,190,80,0.65)" stroke-width="2"
          filter="url(#crack-glow)"/>

    <!-- Main crack edge — cool blue right side -->
    <line x1="628" y1="0" x2="674" y2="720"
          stroke="rgba(100,180,255,0.65)" stroke-width="2"
          filter="url(#crack-glow)"/>

    <!-- Hottest point — white core shard top third -->
    <path d="M 617 0 L 623 0 L 642 280 L 635 280 Z"
          fill="rgba(255,255,255,0.55)"
          filter="url(#crack-glow)"/>

    <!-- Spark / energy burst at top of crack -->
    <circle cx="619" cy="8" r="6" fill="rgba(255,255,255,0.8)" filter="url(#crack-glow)"/>
    <circle cx="619" cy="8" r="18" fill="rgba(200,220,255,0.15)" filter="url(#crack-outer)"/>

    <!-- Bottom spark -->
    <circle cx="663" cy="712" r="4" fill="rgba(80,160,255,0.7)" filter="url(#crack-glow)"/>
  </svg>

  <!-- ░░ BRAND MARK ░░ -->
  <div class="brand-mark">
    <img src="https://heirvo.com/brand/mark.png" alt="Heirvo" onerror="this.style.display='none'">
    <span class="brand-name">heirvo</span>
  </div>

  <!-- ░░ BOTTOM GRADIENT STRIP ░░ -->
  <div class="bottom-strip"></div>

</div>
</body>
</html>
