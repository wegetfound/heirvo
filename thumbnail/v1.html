<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Heirvo Thumbnail v1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #000;
    }

    .thumbnail {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      font-family: 'Sora', sans-serif;
    }

    /* ── Background: scratched disc photo ── */
    .bg-photo {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1611532736597-de2d4265fba3?w=1280&q=80');
      background-size: cover;
      background-position: center 40%;
      filter: saturate(0.6) contrast(1.1);
    }

    /* Dark overlay — heavier on the left (text side), lighter centre/right */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        rgba(0,0,0,0.82) 0%,
        rgba(0,0,0,0.60) 42%,
        rgba(0,0,0,0.30) 100%
      );
    }

    /* Red "danger" vignette glow — reinforces urgency */
    .bg-danger-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 110% 90% at 15% 50%,
        rgba(180,20,20,0.22) 0%,
        transparent 65%
      );
    }

    /* ── Scratched / degraded overlay texture ── */
    .scratch-texture {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        92deg,
        transparent,
        transparent 6px,
        rgba(255,255,255,0.018) 6px,
        rgba(255,255,255,0.018) 7px
      );
      pointer-events: none;
    }

    /* ── Left content column ── */
    .content {
      position: absolute;
      top: 0;
      left: 0;
      width: 700px;
      height: 720px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 52px 56px 52px 68px;
      gap: 0;
    }

    /* ── "DYING DISC" label / eyebrow ── */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(200,30,30,0.92);
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 7px 18px 7px 14px;
      border-radius: 4px;
      width: fit-content;
      margin-bottom: 22px;
      box-shadow: 0 0 28px rgba(220,40,40,0.55);
    }

    .eyebrow-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.7); }
    }

    /* ── Main headline ── */
    .headline {
      font-size: 108px;
      font-weight: 900;
      line-height: 0.93;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      text-shadow:
        0 4px 32px rgba(0,0,0,0.9),
        0 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }

    /* "YOUR MEMORIES" — golden distress color */
    .headline .accent {
      color: #FFD840;
      display: block;
    }

    /* ── Sub-line ── */
    .subline {
      font-size: 29px;
      font-weight: 700;
      color: rgba(255,255,255,0.90);
      line-height: 1.3;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      margin-top: 20px;
      max-width: 520px;
    }

    /* highlight the rescue word */
    .subline .rescue {
      color: #FFD840;
    }

    /* ── Right side: before / after pill cards ── */
    .cards {
      position: absolute;
      right: 44px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: flex-end;
    }

    .card {
      width: 270px;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 48px rgba(0,0,0,0.65);
    }

    .card-label {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 16px;
      text-align: center;
    }

    /* BEFORE card */
    .card-before .card-label {
      background: rgba(180, 25, 25, 0.95);
      color: #fff;
    }

    .card-before .card-visual {
      background: #1a0a0a;
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Broken disc illustration via CSS */
    .broken-disc {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: conic-gradient(
        #2a1a1a 0deg,
        #3c2a2a 40deg,
        #1a0f0f 80deg,
        #2d1e1e 120deg,
        #150d0d 160deg,
        #231515 200deg,
        #1f1010 240deg,
        #2a1818 280deg,
        #1a0d0d 320deg,
        #2a1a1a 360deg
      );
      border: 3px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 24px rgba(180,20,20,0.35) inset;
      position: relative;
    }

    .broken-disc::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #1a0a0a;
      border: 2px solid rgba(255,255,255,0.07);
    }

    /* Scratch lines over broken disc */
    .broken-disc::after {
      content: '';
      position: absolute;
      inset: -10px;
      background:
        linear-gradient(37deg, transparent 42%, rgba(255,255,255,0.18) 42.5%, transparent 43%),
        linear-gradient(125deg, transparent 35%, rgba(255,255,255,0.12) 35.5%, transparent 36%),
        linear-gradient(68deg, transparent 55%, rgba(255,255,255,0.10) 55.5%, transparent 56%);
    }

    .broken-disc-x {
      position: absolute;
      font-size: 40px;
      color: rgba(220,40,40,0.92);
      font-weight: 900;
      text-shadow: 0 0 16px rgba(220,40,40,0.7);
      right: 10px;
      bottom: 8px;
      line-height: 1;
    }

    /* AFTER card */
    .card-after .card-label {
      background: rgba(20, 160, 80, 0.95);
      color: #fff;
    }

    .card-after .card-visual {
      background: linear-gradient(135deg, #071a10 0%, #0c2718 100%);
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      gap: 14px;
    }

    /* Glowing recovered disc */
    .good-disc {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: conic-gradient(
        #c8e6ff 0deg,
        #a0d4f5 30deg,
        #dff0ff 60deg,
        #b8e0ff 90deg,
        #90c8f0 120deg,
        #d0e8ff 150deg,
        #b0d8f8 180deg,
        #c8e6ff 210deg,
        #a8d8ff 240deg,
        #daeeff 270deg,
        #b2dcff 300deg,
        #c8e6ff 360deg
      );
      box-shadow:
        0 0 32px rgba(100,200,255,0.55),
        0 0 8px rgba(100,200,255,0.4) inset;
      border: 2px solid rgba(255,255,255,0.3);
      position: relative;
      flex-shrink: 0;
    }

    .good-disc::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
    }

    /* Photo stack (recovered memories) */
    .photo-stack {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .photo-frame {
      width: 62px;
      height: 44px;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
      overflow: hidden;
    }

    .photo-frame:nth-child(1) {
      background: linear-gradient(135deg, #d4a855 0%, #c18a2a 100%);
      transform: rotate(2deg);
    }

    .photo-frame:nth-child(2) {
      background: linear-gradient(135deg, #7ab8d4 0%, #4a8aaa 100%);
      transform: rotate(-1.5deg);
    }

    .photo-frame:nth-child(3) {
      background: linear-gradient(135deg, #a8c87a 0%, #6a9a42 100%);
      transform: rotate(1deg);
    }

    .checkmark {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 26px;
      color: #4cff8f;
      text-shadow: 0 0 16px rgba(50,255,120,0.7);
      line-height: 1;
    }

    /* ── Arrow between cards ── */
    .arrow-between {
      font-size: 32px;
      color: #FFD840;
      text-align: center;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255,216,64,0.6));
      width: 270px;
    }

    /* ── Logo ── */
    .logo {
      position: absolute;
      top: 32px;
      left: 68px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }

    .logo-text {
      font-family: 'Sora', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    /* ── URL badge ── */
    .url-badge {
      position: absolute;
      bottom: 26px;
      right: 44px;
      font-family: 'Sora', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.70);
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }

    /* ── Bottom urgency strip ── */
    .urgency-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg,
        #c81e1e 0%,
        #ff4d4d 30%,
        #FFD840 60%,
        #4cff8f 100%
      );
      opacity: 0.85;
    }

  </style>
</head>
<body>
  <div class="thumbnail">

    <!-- Background layers -->
    <div class="bg-photo"></div>
    <div class="bg-overlay"></div>
    <div class="bg-danger-glow"></div>
    <div class="scratch-texture"></div>

    <!-- Logo top-left -->
    <div class="logo">
      <img src="https://heirvo.com/brand/mark.png" alt="Heirvo" onerror="this.style.display='none'">
      <span class="logo-text">Heirvo</span>
    </div>

    <!-- Main text content -->
    <div class="content">
      <!-- Eyebrow: live-danger label -->
      <div class="eyebrow">
        <div class="eyebrow-dot"></div>
        Your disc is degrading now
      </div>

      <!-- 4-word headline -->
      <div class="headline">
        DON'T LOSE<br>
        <span class="accent">YOUR MEMORIES</span>
      </div>

      <!-- Sub-line -->
      <p class="subline">
        Scratched DVD&nbsp;→&nbsp;<span class="rescue">recovered forever</span>
      </p>
    </div>

    <!-- Before / After cards right side -->
    <div class="cards">

      <!-- BEFORE -->
      <div class="card card-before">
        <div class="card-label">Before</div>
        <div class="card-visual">
          <div class="broken-disc"></div>
          <span class="broken-disc-x">✕</span>
        </div>
      </div>

      <!-- Arrow -->
      <div class="arrow-between">▼</div>

      <!-- AFTER -->
      <div class="card card-after">
        <div class="card-label">Recovered ✓</div>
        <div class="card-visual">
          <div class="good-disc"></div>
          <div class="photo-stack">
            <div class="photo-frame">👶</div>
            <div class="photo-frame">🎂</div>
            <div class="photo-frame">💒</div>
          </div>
          <span class="checkmark">✓</span>
        </div>
      </div>

    </div>

    <!-- URL -->
    <div class="url-badge">heirvo.com</div>

    <!-- Urgency strip -->
    <div class="urgency-strip"></div>

  </div>
</body>
</html>
